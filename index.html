<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cómo trabajo hoy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.bgfx{display:none}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.top{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:6px 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--acc);color:var(--acc-fg);font:800 15px/1 var(--fd);flex:none}
.brand h1{margin:0;font:700 19px/1.15 var(--fd)}
.brand p{margin:2px 0 0;color:var(--mut);font-size:13px}
.search{flex:1 1 240px;max-width:360px}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.live b{color:var(--fg);font-family:var(--fm);font-weight:600}
#refresh.spin{pointer-events:none;opacity:.7}#refresh.spin::first-letter{display:inline-block}
@media (max-width:640px){.live{margin-left:0;width:100%;justify-content:space-between}.search{max-width:none}}
.search input{width:100%;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;align-items:start}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:none}
.navg{font:600 11px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:16px 10px 6px}
.navg:first-child{padding-top:4px}
.nb{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-size:14px}
.nb:hover{background:var(--surface2)}
.nb.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nb .dot{width:10px;height:10px;border-radius:4px;background:var(--cc,var(--acc));flex:none}
.nb .ct{margin-left:auto;font:500 12px/1 var(--fm);color:var(--mut)}
body.tabs .shell{grid-template-columns:minmax(0,1fr)}
body.tabs nav{top:env(safe-area-inset-top,0px);flex-direction:row;overflow-x:auto;z-index:5;background:var(--bg);padding-block:8px;gap:6px;max-height:none}
body.tabs .navg{display:none}
body.tabs .nb{flex:none;white-space:nowrap}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr)}nav{top:env(safe-area-inset-top,0px);flex-direction:row;overflow-x:auto;z-index:5;background:var(--bg);padding-block:8px;gap:6px;max-height:none}.navg{display:none}.nb{flex:none;white-space:nowrap}}
main{min-width:0}
.lg{--s:42px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.28);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c)}
.lg svg{width:56%;height:56%;fill:currentColor}
.lg b{font:800 calc(var(--s)*.36)/1 var(--fd);letter-spacing:-.02em}
.lg.mono{background:var(--c);color:#fff}
.lg.dk{color:var(--fg);background:color-mix(in srgb,var(--fg) 9%,var(--surface))}
.lg.mono.dk{background:var(--fg);color:var(--bg)}
.lg.sm{--s:30px}.lg.big{--s:64px}
.hero{padding-block:8px 18px}
.kick{font:600 12px/1.2 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 10px}
.ht{font:800 clamp(34px,5.5vw,62px)/1.02 var(--fd);margin:0;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:clamp(15px,1.6vw,18px);color:var(--mut);max-width:60ch;margin:14px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:118px}
.stat b{display:block;font:800 28px/1 var(--fd)}.stat span{font-size:12.5px;color:var(--mut)}
.marq{overflow:hidden;margin-block:22px 26px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mtrack{display:flex;gap:12px;width:max-content;animation:mq 70s linear infinite}
.marq:hover .mtrack{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;transition:transform .18s,box-shadow .18s;min-width:0}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.mini .lg{--s:30px}
.tn{font:700 18px/1.2 var(--fd)}.td{font-size:13.5px;color:var(--mut)}
.tc{position:absolute;top:14px;right:16px;font:700 13px/1 var(--fm);color:var(--cc)}
.tile.feat .tn{font-size:22px}
.go{margin-top:auto;font-weight:700;font-size:13px;color:var(--cc)}
.vh{display:flex;align-items:stretch;gap:16px;padding-block:4px 18px}
.vh h2{font:800 clamp(28px,4vw,44px)/1.05 var(--fd);margin:0;letter-spacing:-.02em;text-wrap:balance}
.vh p{margin:6px 0 0;color:var(--mut)}.vh .kick{margin:0 0 6px;color:var(--cc,var(--acc))}
.vh .bar{width:8px;border-radius:4px;background:var(--cc,var(--acc));flex:none}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px}
.fb.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .18s,box-shadow .18s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.logos{display:flex;gap:6px}
.cb{display:block;min-width:0}
.h3{display:block;font:700 16px/1.25 var(--fd)}
.p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;color:var(--mut);font-size:13.5px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--fb);padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{font:500 11.5px/1 var(--fm);padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.sec{margin-block:28px 12px;display:flex;align-items:center;gap:10px;font:700 20px/1.2 var(--fd)}
.sec i{width:12px;height:12px;border-radius:4px;background:var(--cc)}
.empty{color:var(--mut);padding:30px 0}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:22px 10px}
.appi{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;cursor:pointer;text-align:center;min-width:0;padding:0}
.appi .ic{position:relative}
.appi .lg{--s:64px;border-radius:19px;box-shadow:var(--shadow);transition:transform .15s}
.appi:hover .lg{transform:scale(1.07)}
.al{font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--sc);border:2px solid var(--bg)}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:16px;position:relative}
.flow::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;border-left:2px dashed color-mix(in srgb,var(--acc) 50%,transparent)}
.step{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;position:relative}
.num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-fg);font:800 18px/1 var(--fd);box-shadow:0 0 0 6px var(--bg)}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.st{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st h3{margin:0;font:700 18px/1.2 var(--fd)}
.sb>p{margin:8px 0 0;color:var(--mut)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.role{border:1px solid var(--line);border-radius:calc(var(--r)*.8);padding:12px;background:var(--surface2);min-width:0}
.rh b{display:block;font:700 15px/1.2 var(--fd)}.rh span{font-size:12.5px;color:var(--mut)}
.chain{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.chain li{display:flex;align-items:center;gap:8px;font-size:13.5px;position:relative}
.chain li+li::before{content:"";position:absolute;left:14px;top:-7px;height:7px;border-left:2px solid var(--line)}
.chain em{margin-left:auto;font:500 12px/1 var(--fm);color:var(--mut);font-style:normal;white-space:nowrap}
.chain li:first-child span{font-weight:700}
.note{font-size:13px;color:var(--mut);margin:10px 0 0}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.chk{border-left:3px solid var(--acc);padding:4px 0 4px 12px}.chk b{display:block;font-size:14px}.chk span{font-size:13px;color:var(--mut)}
.verd{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sub{font:700 20px/1.2 var(--fd);margin:28px 0 12px}
.cycle{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.cycle li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px}
.cycle li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-fg);font:700 12px/1 var(--fm)}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.size{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.size b{font:800 34px/1 var(--fd);color:var(--acc)}.size h4{margin:6px 0 4px;font:700 16px/1.2 var(--fd)}.size p{margin:0;color:var(--mut);font-size:13.5px}
.princ{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.princ li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:10px 12px;font-size:14px}
.princ li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-weight:800;font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.btn small{font:500 11px/1 var(--fm);opacity:.7}
.btn.art{border-color:color-mix(in srgb,var(--acc) 55%,var(--line));color:var(--acc)}
.btn.sm{padding:6px 11px;font-size:12.5px}.btn.ghost{background:transparent}
.qa{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.card{position:relative}.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.sh-bg{position:absolute;inset:0;background:rgba(10,12,20,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sh-p{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--sheet,var(--surface));color:var(--fg);border-radius:calc(var(--r)*1.2);padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.sh-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:20px;line-height:1}
.sh-h{display:flex;gap:8px}
.sh-c{margin:16px 0 4px;font:600 12px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.sh-p h2{margin:0;font:800 26px/1.15 var(--fd);text-wrap:balance}
.sh-d{color:var(--mut);margin:8px 0 12px}
.shs{margin:20px 0 0;font:600 12px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.shs+.acts{margin-top:10px}
.inc{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.inc li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);background:var(--surface2)}
.inc li div{min-width:0;flex:1}.inc b{display:block;font-size:14px}.inc span{display:block;font-size:12.5px;color:var(--mut);line-height:1.4}
.inc .btn{flex:none;padding:7px 12px}
.inst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.inst b{font:700 15px/1.2 var(--fd)}.inst .acts{margin-top:10px}.inst .btn{padding:7px 12px;font-size:13px}
.tag.how{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.path{font:12px/1.4 var(--fm);color:var(--mut);word-break:break-all;margin:12px 0 0}
.sh-p.wide{width:min(1100px,100%)}
.vw-h{display:grid;gap:4px;margin-bottom:14px}.vw-h .btn{justify-self:start}.vw-h h2{margin:0}
.vw-t{margin:0;padding:16px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line,rgba(255,255,255,.1));font:12.5px/1.55 var(--fm);white-space:pre-wrap;word-break:break-word;max-height:68vh;overflow:auto}
.vw-f{width:100%;height:72vh;border:0;border-radius:12px;background:#fff}
.vw-pdf{display:grid;gap:12px;max-height:72vh;overflow:auto}.vw-pdf canvas{width:100%;height:auto;border-radius:8px;background:#fff}
.vw-v{width:100%;max-height:72vh;border-radius:12px;background:#000}
.vw-d{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.vw-i{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line,rgba(255,255,255,.1));background:rgba(255,255,255,.04);color:inherit;font:inherit;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.vw-i:hover{background:rgba(255,255,255,.1)}.vw-i small{margin-left:auto;color:var(--mut);white-space:nowrap}.vw-i.off{opacity:.6}
.vw-o{display:grid;gap:10px;justify-items:start;padding:16px;border-radius:12px;background:rgba(255,255,255,.05)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px);word-break:break-all}
.orbit-w{display:grid;justify-items:center;gap:14px;margin-block:4px 6px}
.orbit{position:relative;width:min(620px,100%);aspect-ratio:1}
.ring{position:absolute;width:var(--sz);height:var(--sz);left:calc((100% - var(--sz))/2);top:calc((100% - var(--sz))/2);border:1.5px dashed var(--ring,var(--line));border-radius:50%;animation:spin var(--sp) linear infinite}
.sat{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer}
.sat .lg{--s:clamp(28px,6.6vw,46px);box-shadow:var(--shadow);animation:spin var(--sp) linear infinite reverse}
.sat:hover .lg{outline:3px solid var(--acc);outline-offset:2px}
.orbit:hover .ring,.orbit:hover .sat .lg{animation-play-state:paused}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;text-align:center}
.core .lg{--s:clamp(60px,13vw,96px);border-radius:50%;box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 16%,transparent),0 0 70px color-mix(in srgb,var(--acc) 55%,transparent)}
.core b{font:800 18px/1 var(--fd);margin-top:12px}.core span{font-size:12px;color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}
.olegend{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;padding:0;margin:0;font-size:13px;color:var(--mut)}
.olegend i{display:inline-block;width:18px;border-top:2px dashed var(--ring,var(--line));margin-right:6px;vertical-align:middle}
.term{border-radius:var(--r);overflow:hidden;border:1px solid #2A3140;background:#0E1117;color:#D6DEEB;font:13.5px/1.6 var(--fm);margin-block:14px 4px;box-shadow:var(--shadow-h)}
.tbar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#161B24;font-size:12px;color:#8A94A6}
.tbar i{width:11px;height:11px;border-radius:50%;background:#FF5F57;flex:none}.tbar i:nth-child(2){background:#FEBC2E}.tbar i:nth-child(3){background:#28C840}
.tbar span{margin-left:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlog{padding:14px 16px 18px;display:grid;gap:8px}
.tl{margin:0;display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;opacity:0;animation:tin .45s ease forwards;animation-delay:var(--d)}
.who{font-weight:700;color:#7FDBCA}.tl.u .who{color:#FFCB6B}.tl.c .who{color:#F78C6C}.tl.t{color:#9AA5B1}.tl.t .who{color:#82AAFF}.tl.a .who{color:#C3E88D}
.caret{display:inline-block;width:8px;height:16px;background:#D6DEEB;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes tin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){.tl{grid-template-columns:minmax(0,1fr);gap:0}.flow::before{left:17px}.step{grid-template-columns:36px minmax(0,1fr);gap:10px}.num{width:36px;height:36px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.tl{opacity:1}.mtrack{flex-wrap:wrap;width:auto}}
